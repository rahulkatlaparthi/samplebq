name: BigQuery SQL Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**/*.sql'
      - 'sql/*.sql'

jobs:
  deploy-bigquery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Find changed SQL files
        id: changed_sql
        run: |
          echo "Checking for changed SQL files..."

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "Before commit: $BEFORE"
          echo "After commit:  $AFTER"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial commit detected."

            CHANGED_FILES=$(git ls-tree -r --name-only "$AFTER" | grep -E '^sql/.*\.sql$' || true)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" | grep -E '^sql/.*\.sql$' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No SQL files changed."
            exit 0
          fi

          echo "Changed SQL files:"
          echo "$CHANGED_FILES"

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Run changed SQL files
        run: |
          CHANGED_FILES="${{ steps.changed_sql.outputs.files }}"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No SQL files to execute."
            exit 0
          fi

          echo "Starting BigQuery deployment..."

          while IFS= read -r FILE
          do
            if [ -z "$FILE" ]; then
              continue
            fi

            echo "========================================"
            echo "Running SQL file: $FILE"
            echo "========================================"

            bq query \
              --use_legacy_sql=false \
              --project_id=qwiklabs-gcp-00-38c5c3a6722c \
              < "$FILE"

            echo "Completed: $FILE"
            echo ""

          done <<< "$CHANGED_FILES"

