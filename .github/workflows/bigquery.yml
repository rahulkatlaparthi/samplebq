name: Airflow DAG Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**/*.py'
      - 'dags/*.py'

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Find changed Python files
        id: changed_py
        run: |
          echo "Checking for changed Python files..."

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          echo "Before: $BEFORE"
          echo "After:  $AFTER"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial commit detected."

            CHANGED_FILES=$(git ls-tree -r --name-only "$AFTER" | \
              grep -E '^dags/.*\.py$' || true)
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" | \
              grep -E '^dags/.*\.py$' || true)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python DAG files changed."
            exit 0
          fi

          echo "Changed Python files:"
          echo "$CHANGED_FILES"

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate changed Python files
        run: |
          CHANGED_FILES="${{ steps.changed_py.outputs.files }}"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No Python files to validate."
            exit 0
          fi

          while IFS= read -r FILE
          do
            if [ -z "$FILE" ]; then
              continue
            fi

            echo "========================================"
            echo "Validating: $FILE"
            echo "========================================"

            python -m py_compile "$FILE"

            echo "Validation successful: $FILE"

          done <<< "$CHANGED_FILES"

      - name: Deploy changed DAG files to Composer
        run: |
          CHANGED_FILES="${{ steps.changed_py.outputs.files }}"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No DAG files to deploy."
            exit 0
          fi

          while IFS= read -r FILE
          do
            if [ -z "$FILE" ]; then
              continue
            fi

            echo "========================================"
            echo "Deploying: $FILE"
            echo "========================================"

            gsutil cp "$FILE" \
              "gs://asia-southeast1-cccg-cd06b905-bucket/dags/"

            echo "Deployed: $FILE"

          done <<< "$CHANGED_FILES"

      - name: Deployment complete
        run: |
          echo "========================================"
          echo "Airflow DAG deployment completed"
          echo "Composer Environment: cccg"
          echo "Region: asia-southeast1"
          echo "DAG Bucket:"
          echo "gs://asia-southeast1-cccg-cd06b905-bucket/dags/"
          echo "========================================"
